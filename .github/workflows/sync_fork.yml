name: Sync fork

on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
  
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: sync fork
        shell: bash
        run: gh repo sync ${{ github.repository }} -b master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
